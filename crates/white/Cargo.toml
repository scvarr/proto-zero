[package]
name = "agent_white"
version = "0.1.0"
edition.workspace = true

[dependencies]
protozero_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Метрики и HTTP
prometheus = "0.13"
once_cell = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hyper = "1.7.0"