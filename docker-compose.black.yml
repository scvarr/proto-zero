volumes:
  pz-receptor: {}
  pz-lock: {}

services:
  receptor-init:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /receptor; : > /receptor/cell; truncate -s 1 /receptor/cell; chmod 666 /receptor/cell"]
    volumes: ["pz-receptor:/receptor"]
    restart: "no"

  lock-black:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /lock && echo 1 > /lock/BLACK && tail -f /dev/null"]
    volumes: ["pz-lock:/lock"]

  world:
    build: { context: ., dockerfile: docker/world.Dockerfile }
    depends_on:
      receptor-init:
        condition: service_completed_successfully
      lock-black:
        condition: service_started
    volumes: ["pz-receptor:/receptor"]
    ports:
      - "8080:8080"

  black:
    build: { context: ., dockerfile: docker/black.Dockerfile }
    depends_on:
      receptor-init:
        condition: service_completed_successfully
      lock-black:
        condition: service_started
      world:
        condition: service_started
    volumes:
      - "pz-receptor:/receptor:ro"
      - "pz-lock:/lock"
    entrypoint: ["/bin/sh","-lc","test -f /lock/WHITE && echo 'Conflict: WHITE stack running' >&2 && exit 42 || true; exec black"]
