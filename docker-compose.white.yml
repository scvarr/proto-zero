volumes:
  pz-receptor: {}
  pz-lock: {}
  grafana-storage: {}
  prometheus-data: {}

services:
  receptor-init:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /receptor; : > /receptor/cell; truncate -s 1 /receptor/cell; chmod 666 /receptor/cell"]
    volumes: ["pz-receptor:/receptor"]
    restart: "no"

  lock-white:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /lock && echo 1 > /lock/WHITE && tail -f /dev/null"]
    volumes: ["pz-lock:/lock"]

  world:
    build: { context: ., dockerfile: docker/world.Dockerfile }
    depends_on:
      receptor-init:
        condition: service_completed_successfully
      lock-white:
        condition: service_started
    volumes: ["pz-receptor:/receptor"]
    ports:
      - "8080:8080"

  white:
    build: { context: ., dockerfile: docker/white.Dockerfile }
    environment:
      - WHITE_METRICS_ADDR=0.0.0.0:9100
    depends_on:
      receptor-init:
        condition: service_completed_successfully
      lock-white:
        condition: service_started
      world:
        condition: service_started
    volumes:
      - "pz-receptor:/receptor:ro"
      - "pz-lock:/lock"
    entrypoint: ["/bin/sh","-lc","test -f /lock/BLACK && echo 'Conflict: BLACK stack running' >&2 && exit 42 || true; exec white"]

  observer:
    build: { context: ., dockerfile: docker/observer.Dockerfile }
    environment:
      - OBSERVER_ADDR=0.0.0.0:7070
      - OBSERVER_WORLD_CELL_URL=http://world:8080/cell
      - OBSERVER_WHITE_STATE_URL=http://white:9100/state
    depends_on:
      - world
      - white
    ports:
      - "7070:7070"

  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - white

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus