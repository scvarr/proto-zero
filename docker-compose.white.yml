volumes:
  pz-io: {}
  pz-lock: {}
  grafana-storage: {}
  prometheus-data: {}

services:
  fifo-init:
    image: alpine
    command: ["/bin/sh","-lc","mkfifo -m 666 /io/world-stream || true; mkfifo -m 666 /io/agent-stream || true; tail -f /dev/null"]
    volumes: ["pz-io:/io"]

  lock-white:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /lock && echo 1 > /lock/WHITE && tail -f /dev/null"]
    volumes: ["pz-lock:/lock"]

  world:
    build: { context: ., dockerfile: docker/world.Dockerfile }
    depends_on: [ fifo-init, lock-white ]
    volumes: ["pz-io:/io"]
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh","-lc","test -p /io/world-stream || mkfifo -m 666 /io/world-stream; exec world > /io/world-stream"]

  observer:
    build: { context: ., dockerfile: docker/observer.Dockerfile }
    environment:
      - OBSERVER_ADDR=0.0.0.0:7070
      - OBSERVER_WORLD_CONFIG_URL=http://world:8080/config
      - OBSERVER_METRICS_URL=http://white:9100/metrics
    depends_on: [ fifo-init, world ]
    volumes: ["pz-io:/io"]
    ports:
      - "7070:7070"
    entrypoint: ["/bin/sh","-lc","test -p /io/world-stream || mkfifo -m 666 /io/world-stream; test -p /io/agent-stream || mkfifo -m 666 /io/agent-stream; exec cat /io/world-stream | observer > /io/agent-stream"]

  white:
    build: { context: ., dockerfile: docker/white.Dockerfile }
    environment:
      - WHITE_METRICS_ADDR=0.0.0.0:9100
    depends_on: [ fifo-init, lock-white, observer ]
    volumes: ["pz-io:/io","pz-lock:/lock"]
    entrypoint: ["/bin/sh","-lc","test -f /lock/BLACK && echo 'Conflict: BLACK stack running' >&2 && exit 42 || true; exec cat /io/agent-stream | white"]

  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [ prometheus ]
