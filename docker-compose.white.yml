volumes:
  pz-io: {}
  pz-lock: {}

services:
  fifo-init:
    image: alpine
    command: ["/bin/sh","-lc","mkfifo -m 666 /io/stream || true; tail -f /dev/null"]
    volumes: ["pz-io:/io"]

  lock-white:
    image: alpine
    command: ["/bin/sh","-lc","mkdir -p /lock && echo 1 > /lock/WHITE && tail -f /dev/null"]
    volumes: ["pz-lock:/lock"]

  world:
    build: { context: ., dockerfile: docker/world.Dockerfile }
    depends_on: [ fifo-init, lock-white ]
    volumes: ["pz-io:/io"]
    entrypoint: ["/bin/sh","-lc","cat /dev/urandom | world --source=stdin --chunk=1 > /io/stream"]

  white:
    build: { context: ., dockerfile: docker/white.Dockerfile }
    depends_on: [ fifo-init, lock-white, world ]
    volumes: ["pz-io:/io","pz-lock:/lock"]
    # Шим проверяет конфликт (наличие BLACK-лока), затем подаёт поток в stdin white
    entrypoint: ["/bin/sh","-lc","test -f /lock/BLACK && echo 'Conflict: BLACK stack running' >&2 && exit 42 || true; cat /io/stream | white"]
