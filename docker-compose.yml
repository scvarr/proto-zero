version: "3.9"
services:
  world:
    build:
      context: .
      dockerfile: Dockerfile
      args: { BUILD_PKG: world-noise, RUN_BIN: world-noise }
    environment:
      WORLD_ADDR: "0.0.0.0:7000"
    ports: ["7000:7000"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  kernel-black:
    build:
      context: .
      dockerfile: Dockerfile
      args: { BUILD_PKG: kernel-black, RUN_BIN: kernel-black }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  kernel-white:
    build:
      context: .
      dockerfile: Dockerfile
      args: { BUILD_PKG: kernel-white, RUN_BIN: kernel-white }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
